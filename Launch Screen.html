<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnlyBody — Launch Screen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Sans', sans-serif;
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useRef, useEffect } = React;

const CREAM = '#F5F0E8';
const AMBER = '#E8A23A';

// ── OB Lettermark drawn on canvas ─────────────────────────────────────────
function OBMark({ size = 120 }) {
  const ref = useRef(null);

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 2;
    const S = size;
    canvas.width  = S * dpr;
    canvas.height = S * dpr;
    canvas.style.width  = S + 'px';
    canvas.style.height = S + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // Warm bloom behind the mark
    const bloom = ctx.createRadialGradient(S*.38, S*.5, 0, S*.5, S*.5, S*.7);
    bloom.addColorStop(0, 'rgba(232,162,58,0.18)');
    bloom.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, S, S);

    const fs = S * 0.68;
    ctx.font = `900 italic ${fs}px 'DM Sans', sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    // "O" amber with soft glow
    ctx.shadowColor = 'rgba(232,162,58,0.55)';
    ctx.shadowBlur  = S * 0.06;
    ctx.fillStyle   = AMBER;
    ctx.fillText('O', S * 0.37, S * 0.49);

    // "B" cream, overlapping
    ctx.shadowBlur  = 0;
    ctx.fillStyle   = CREAM;
    ctx.fillText('B', S * 0.63, S * 0.49);

    // Baseline rule — amber
    const bh = Math.max(1.5, S * 0.022);
    ctx.fillStyle = AMBER;
    ctx.fillRect(S * 0.13, S * 0.82, S * 0.74, bh);
  }, [size]);

  return <canvas ref={ref} style={{ display:'block' }} />;
}

// ── The actual launch screen content ──────────────────────────────────────
function LaunchContent() {
  return (
    <div style={{
      width: '100%',
      height: '100%',
      background: '#0C0C0B',
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      paddingTop: 60,
      position: 'relative',
      overflow: 'hidden',
    }}>

      {/* Very subtle radial warm field, centered */}
      <div style={{
        position: 'absolute',
        inset: 0,
        background: 'radial-gradient(ellipse 70% 50% at 50% 50%, rgba(232,162,58,0.055) 0%, transparent 100%)',
        pointerEvents: 'none',
      }} />

      {/* Mark + wordmark group, centered */}
      <div style={{
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        gap: 28,
        position: 'relative',
      }}>

        {/* OB mark */}
        <OBMark size={112} />

        {/* Wordmark */}
        <div style={{
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          gap: 6,
        }}>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontWeight: 800,
            fontSize: 26,
            letterSpacing: '0.01em',
            color: '#F5F0E8',
            lineHeight: 1,
          }}>
            Only<span style={{ color: AMBER }}>Body</span>
          </div>
          <div style={{
            fontFamily: "'DM Sans', sans-serif",
            fontWeight: 400,
            fontSize: 11,
            letterSpacing: '0.22em',
            color: 'rgba(245,240,232,0.28)',
            textTransform: 'uppercase',
          }}>
            Calisthenics Training
          </div>
        </div>
      </div>

    </div>
  );
}

// ── Wrap in iPhone frame ───────────────────────────────────────────────────
function App() {
  return (
    <div style={{
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      minHeight: '100vh',
      padding: 40,
    }}>
      <div style={{
        transform: 'scale(0.82)',
        transformOrigin: 'center center',
      }}>
        <IOSDevice dark={true}>
          <LaunchContent />
        </IOSDevice>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
