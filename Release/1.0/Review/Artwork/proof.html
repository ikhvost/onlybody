<!doctype html><html lang="uk"><meta charset="utf-8"><title>OnlyBody + OnlyWeights — iPhone artwork</title>
<style>body{margin:0;padding:24px;background:#171715;color:#f0ede7;font:16px system-ui,sans-serif}h1{margin:0 0 5px;font-size:24px}p{margin:0 0 18px;color:#bcb8ac;font-size:13px}h2{font-size:17px;margin:16px 0 10px}.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}img{display:block;width:100%;border-radius:12px}main{max-width:1280px;margin:auto}</style>
<main><h1>OnlyBody + OnlyWeights</h1><p>iPhone · Українська · Чернетка оформлення для перегляду</p><h2>OnlyBody</h2><div id="body" class="row"></div><h2>OnlyWeights</h2><div id="weights" class="row"></div></main>
<script>for(const [product,id] of [['OnlyBody','body'],['OnlyWeights','weights']]){for(let n=1;n<=6;n++){const i=new Image;i.src=product+'-uk-iPhone-'+String(n).padStart(2,'0')+'.png';i.alt=product+' '+n;document.getElementById(id).append(i)}}</script></html>
