included:
  - Apps/iOS/Sources
  - Apps/iOS/Products
  - Apps/iOS/ProductTests
  - Apps/iOS/Tests
  - Apps/iOS/UITests
  - Scripts/StoreGenerator/Sources
excluded:
  - Scripts/StoreGenerator/.build
# Fixed Canvas paths and fixture-heavy test suites intentionally contain short coordinates and long cases.
disabled_rules:
  - identifier_name
  - large_tuple
  - trailing_comma
line_length:
  warning: 160
  error: 240
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
file_length:
  warning: 800
  error: 1000
function_body_length:
  warning: 90
  error: 150
type_body_length:
  warning: 700
  error: 900
