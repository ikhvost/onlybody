<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnlyBody</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
}
:root {
  --accent: #E8A23A;
  --accent-dim: rgba(232,162,58,0.13);
  --accent-dark: #0C0C0B;
  --bg: #0C0C0B;
  --surface: #161614;
  --surface2: #1E1E1B;
  --border: rgba(255,250,230,0.07);
  --border2: rgba(255,250,230,0.13);
  --text: #F5F0E8;
  --text2: rgba(245,240,232,0.5);
  --text3: rgba(245,240,232,0.24);
  --danger: #E05A4E;
  --success: #4CAF6E;
  --mono: 'DM Mono', monospace;
}
input, button { font-family: 'DM Sans', sans-serif; }
input::placeholder { color: var(--text3); }
::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ── DATA ───────────────────────────────────────────────────────────────────
const WORKOUTS = [
  { id:1, name:"Full Body", days:["Mon","Wed","Fri"], exercises:[
    { name:"Push-Ups", sets:3, reps:12, rest:45 },
    { name:"Pull-Ups", sets:3, reps:8,  rest:60 },
    { name:"Squats",   sets:4, reps:15, rest:45 },
    { name:"Dips",     sets:3, reps:10, rest:60 },
    { name:"Pike Push-Ups", sets:3, reps:10, rest:45 },
  ]},
  { id:2, name:"Upper Body", days:["Tue","Thu"], exercises:[
    { name:"Push-Ups",        sets:4, reps:15, rest:45 },
    { name:"Archer Push-Ups", sets:3, reps:8,  rest:60 },
    { name:"Dips",            sets:3, reps:12, rest:60 },
    { name:"Pike Push-Ups",   sets:3, reps:10, rest:45 },
  ]},
  { id:3, name:"Lower Body", days:[], exercises:[
    { name:"Squats",       sets:4, reps:20, rest:45 },
    { name:"Lunges",       sets:3, reps:12, rest:45 },
    { name:"Glute Bridge", sets:3, reps:15, rest:30 },
    { name:"Calf Raises",  sets:3, reps:20, rest:30 },
  ]},
  { id:4, name:"Core", days:[], exercises:[
    { name:"Plank",            sets:3, reps:0,  rest:30 },
    { name:"Hollow Body Hold", sets:3, reps:0,  rest:30 },
    { name:"Leg Raises",       sets:3, reps:12, rest:30 },
  ]},
];

const MOVEMENTS_DB = [
  { name:"Push-Ups",           muscle:"Chest",     secondary:"Triceps, Shoulders", equipment:"None",         custom:false },
  { name:"Pull-Ups",           muscle:"Back",      secondary:"Biceps",             equipment:"Pull-up bar",  custom:false },
  { name:"Squats",             muscle:"Quads",     secondary:"Glutes, Hamstrings", equipment:"None",         custom:false },
  { name:"Dips",               muscle:"Triceps",   secondary:"Chest, Shoulders",   equipment:"Dip Station",  custom:false },
  { name:"Pike Push-Ups",      muscle:"Shoulders", secondary:"Triceps",            equipment:"None",         custom:false },
  { name:"Archer Push-Ups",    muscle:"Chest",     secondary:"Shoulders",          equipment:"None",         custom:false },
  { name:"Lunges",             muscle:"Quads",     secondary:"Glutes",             equipment:"None",         custom:false },
  { name:"Glute Bridge",       muscle:"Glutes",    secondary:"Hamstrings",         equipment:"None",         custom:false },
  { name:"Plank",              muscle:"Core",      secondary:"Shoulders",          equipment:"None",         custom:false },
  { name:"Hollow Body Hold",   muscle:"Core",      secondary:"Hip Flexors",        equipment:"None",         custom:false },
  { name:"Leg Raises",         muscle:"Core",      secondary:"Hip Flexors",        equipment:"None",         custom:false },
  { name:"Calf Raises",        muscle:"Calves",    secondary:"—",                  equipment:"None",         custom:false },
  { name:"Chin-Ups",           muscle:"Back",      secondary:"Biceps",             equipment:"Pull-up bar",  custom:false },
  { name:"Muscle-Ups",         muscle:"Back",      secondary:"Chest, Triceps",     equipment:"Pull-up bar",  custom:false },
  { name:"Bulgarian Split Squats", muscle:"Quads", secondary:"Glutes",             equipment:"None",         custom:true  },
];

const LOG_DATA = [
  { month:"May",   day:"Friday",    dayNum:1,  workout:"Full Body",   duration:"24:10", cals:102 },
  { month:"April", day:"Saturday",  dayNum:25, workout:"Upper Body",  duration:"36:18", cals:140 },
  { month:"April", day:"Wednesday", dayNum:22, workout:"Full Body",   duration:"28:05", cals:115 },
  { month:"April", day:"Saturday",  dayNum:18, workout:"Lower Body",  duration:"31:44", cals:130 },
];

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const MUSCLE_GROUPS = [
  {id:"chest",     label:"Chest"},     {id:"back",      label:"Back"},
  {id:"shoulders", label:"Shoulders"}, {id:"arms",      label:"Arms"},
  {id:"core",      label:"Core"},      {id:"quads",     label:"Quads"},
  {id:"glutes",    label:"Glutes"},    {id:"hamstrings",label:"Hamstrings"},
  {id:"calves",    label:"Calves"},    {id:"fullbody",  label:"Full Body"},
  {id:"upper",     label:"Upper"},     {id:"lower",     label:"Lower"},
];

// ── ICONS ──────────────────────────────────────────────────────────────────
// Hand-crafted — NOT SF Symbol clones
const I = ({ n, size=20, color="currentColor", style={} }) => {
  const s = { stroke:color, strokeWidth:"1.8", strokeLinecap:"square", strokeLinejoin:"miter" };
  const shapes = {
    train:    <g {...s}><rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="4" width="8" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></g>,
    log:      <g {...s}><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M13 14h4" /></g>,
    library:  <g {...s}><circle cx="10" cy="10" r="6.5" fill="none"/><path d="M15 15l4 4M10 7v6M7 10h6"/></g>,
    back:     <g {...s}><path d="M16 4L8 12l8 8"/></g>,
    fwd:      <g {...s}><path d="M8 4l8 8-8 8"/></g>,
    plus:     <g {...s}><path d="M12 4v16M4 12h16"/></g>,
    play:     <polygon points="6,3 20,12 6,21" fill={color} stroke="none"/>,
    edit:     <g {...s}><path d="M4 20l4-1 11-11-3-3L5 17z"/><path d="M14 6l3 3"/></g>,
    remove:   <g {...s}><rect x="3" y="3" width="18" height="18" rx="1" fill="none"/><path d="M8 8l8 8M16 8l-8 8"/></g>,
    check:    <g stroke={color} strokeWidth="2.5" strokeLinecap="square" strokeLinejoin="miter"><path d="M4 12l6 6 10-10"/></g>,
    search:   <g {...s}><circle cx="10.5" cy="10.5" r="6.5" fill="none"/><path d="M15.5 15.5L20 20"/></g>,
    chevron:  <g {...s}><path d="M9 4l8 8-8 8"/></g>,
    drag:     <g fill={color}><rect x="7" y="5" width="2.5" height="2.5" rx="0.5"/><rect x="7" y="11" width="2.5" height="2.5" rx="0.5"/><rect x="7" y="17" width="2.5" height="2.5" rx="0.5"/><rect x="14.5" y="5" width="2.5" height="2.5" rx="0.5"/><rect x="14.5" y="11" width="2.5" height="2.5" rx="0.5"/><rect x="14.5" y="17" width="2.5" height="2.5" rx="0.5"/></g>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={style}>{shapes[n]||null}</svg>;
};

// ── PRIMITIVES ─────────────────────────────────────────────────────────────
const Mono = ({ children, size=10, color="var(--text3)", spacing=1 }) => (
  <span style={{ fontFamily:"var(--mono)", fontSize:size, color, letterSpacing:spacing, textTransform:"uppercase" }}>{children}</span>
);

const Label = ({ children, style={} }) => (
  <div style={{ fontFamily:"var(--mono)", fontSize:10, color:"var(--text3)", letterSpacing:1.5, textTransform:"uppercase", marginBottom:8, ...style }}>{children}</div>
);

const PrimaryBtn = ({ onClick, children, disabled=false, style={} }) => (
  <button onClick={onClick} disabled={disabled} style={{
    width:"100%", padding:"15px", borderRadius:4,
    background: disabled ? "var(--surface2)" : "var(--accent)",
    border:"none",
    color: disabled ? "var(--text3)" : "var(--accent-dark)",
    fontSize:15, fontWeight:700, fontFamily:"DM Sans, sans-serif",
    cursor: disabled ? "default" : "pointer",
    letterSpacing:0.3, transition:"all 0.15s", ...style,
  }}>{children}</button>
);

const GhostBtn = ({ onClick, children, style={} }) => (
  <button onClick={onClick} style={{
    padding:"8px 14px", borderRadius:4,
    background:"none", border:"1px solid var(--border2)",
    color:"var(--text2)", fontSize:13, fontWeight:500,
    fontFamily:"DM Sans, sans-serif", cursor:"pointer", ...style,
  }}>{children}</button>
);

const BackBtn = ({ onClick }) => (
  <button onClick={onClick} style={{ background:"none", border:"none", color:"var(--accent)", cursor:"pointer", display:"flex", alignItems:"center", gap:4, fontSize:14, fontWeight:600, padding:0, fontFamily:"DM Sans, sans-serif" }}>
    <I n="back" size={16} color="var(--accent)" /> Back
  </button>
);

const NavBar = ({ left, center, right }) => (
  <div style={{ padding:"10px 18px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:"1px solid var(--border)", minHeight:46 }}>
    <div style={{ flex:1 }}>{left}</div>
    <div style={{ fontSize:15, fontWeight:700, color:"var(--text)", letterSpacing:-0.2 }}>{center}</div>
    <div style={{ flex:1, display:"flex", justifyContent:"flex-end" }}>{right}</div>
  </div>
);

const Chip = ({ label, on, onClick, small=false }) => (
  <button onClick={onClick} style={{
    padding: small ? "5px 10px" : "8px 15px",
    borderRadius:3, cursor:"pointer",
    fontSize: small ? 11 : 13, fontWeight:600,
    fontFamily:"DM Sans, sans-serif",
    transition:"all 0.12s",
    background: on ? "var(--accent)" : "var(--surface2)",
    border: on ? "1px solid var(--accent)" : "1px solid var(--border2)",
    color: on ? "var(--accent-dark)" : "var(--text2)",
  }}>{label}</button>
);

const Stepper = ({ value, onDec, onInc, fmt=v=>v, accent=false }) => (
  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
    <button onClick={onDec} style={{ width:28, height:28, borderRadius:3, background:"var(--surface2)", border:"1px solid var(--border2)", color:"var(--text)", fontSize:18, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>−</button>
    <span style={{ minWidth:36, textAlign:"center", fontSize:20, fontWeight:500, color: accent ? "var(--accent)" : "var(--text)", fontFamily:"var(--mono)" }}>{fmt(value)}</span>
    <button onClick={onInc} style={{ width:28, height:28, borderRadius:3, background:"var(--accent)", border:"none", color:"var(--accent-dark)", fontSize:18, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>+</button>
  </div>
);

// ── BOTTOM NAV ─────────────────────────────────────────────────────────────
const BottomNav = ({ tab, setTab }) => {
  const tabs = [
    { id:"workouts", label:"TRAIN",   icon:"train"   },
    { id:"history",  label:"LOG",     icon:"log"     },
    { id:"exercises",label:"LIBRARY", icon:"library" },
  ];
  return (
    <div style={{ display:"flex", borderTop:"1px solid var(--border)", background:"var(--bg)" }}>
      {tabs.map(t => {
        const active = tab === t.id;
        return (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex:1, padding:"10px 0 10px", background:"none", border:"none",
            display:"flex", flexDirection:"column", alignItems:"center", gap:6,
            cursor:"pointer",
          }}>
            <I n={t.icon} size={19} color={active ? "var(--accent)" : "rgba(245,240,232,0.28)"} />
            <Mono size={9} color={active ? "var(--accent)" : "var(--text3)"} spacing={1.2}>{t.label}</Mono>
            <div style={{ width:16, height:2, borderRadius:1, background: active ? "var(--accent)" : "transparent", marginTop:-2 }} />
          </button>
        );
      })}
    </div>
  );
};

// ── TRAIN SCREEN ───────────────────────────────────────────────────────────
const TrainScreen = ({ onStart, onEdit, onAdd }) => {
  const today = DAYS[new Date().getDay()];
  const todayWorkouts = WORKOUTS.filter(w => w.days.includes(today));

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg)" }}>
      {/* Header */}
      <div style={{ padding:"16px 18px 10px", display:"flex", alignItems:"flex-end", justifyContent:"space-between" }}>
        <div>
          <Mono size={9} color="var(--text3)" spacing={1.2}>
            {new Date().toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' }).toUpperCase()}
          </Mono>
          <div style={{ fontSize:26, fontWeight:800, color:"var(--text)", letterSpacing:-1, lineHeight:1.1, marginTop:3 }}>OnlyBody</div>
        </div>
        <button onClick={onAdd} style={{ width:34, height:34, borderRadius:4, background:"var(--accent)", border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
          <I n="plus" size={15} color="var(--accent-dark)" />
        </button>
      </div>

      {/* Day strip */}
      <div style={{ padding:"6px 18px 10px", display:"flex", gap:4 }}>
        {DAYS.map(d => {
          const isToday = d === today;
          const has = WORKOUTS.some(w => w.days.includes(d));
          return (
            <div key={d} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:5, padding:"5px 0", borderBottom: isToday ? "2px solid var(--accent)" : "2px solid transparent" }}>
              <Mono size={8} color={isToday ? "var(--accent)" : "var(--text3)"} spacing={0.3}>{d}</Mono>
              <div style={{ width:3, height:3, borderRadius:0, background: has ? (isToday ? "var(--accent)" : "var(--border2)") : "transparent" }} />
            </div>
          );
        })}
      </div>

      {/* Today callout */}
      {todayWorkouts.length > 0 ? (
        <div style={{ margin:"0 18px 10px", padding:"10px 14px", background:"var(--accent-dim)", borderLeft:"2px solid var(--accent)" }}>
          <Mono size={9} color="var(--accent)" spacing={1}>Today</Mono>
          <div style={{ fontSize:13, color:"var(--text)", fontWeight:700, marginTop:2 }}>{todayWorkouts.map(w=>w.name).join(" · ")}</div>
        </div>
      ) : (
        <div style={{ margin:"0 18px 10px", padding:"10px 14px", borderLeft:"2px solid var(--border2)" }}>
          <Mono size={9} color="var(--text3)" spacing={1}>Rest day</Mono>
        </div>
      )}

      {/* Session rows */}
      <div style={{ flex:1, overflowY:"auto" }}>
        {WORKOUTS.map((w, i) => {
          const isToday = w.days.includes(today);
          return (
            <div key={w.id} style={{ padding:"13px 18px", borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", gap:14, borderLeft: isToday ? "2px solid var(--accent)" : "2px solid transparent" }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:3 }}>{w.name}</div>
                <Mono size={9} color="var(--text3)" spacing={0.5}>
                  {w.days.length ? w.days.join(" · ") : "UNSCHEDULED"} &nbsp;·&nbsp; {w.exercises.length} MVMTS
                </Mono>
              </div>
              <button onClick={() => onEdit(w)} style={{ background:"none", border:"none", cursor:"pointer", padding:6 }}>
                <I n="edit" size={15} color="var(--text3)" />
              </button>
              <button onClick={() => onStart(w)} style={{ padding:"0 14px", height:36, borderRadius:3, background:"var(--accent)", border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"var(--mono)", fontSize:11, fontWeight:500, color:"var(--accent-dark)", letterSpacing:1.2, whiteSpace:"nowrap" }}>
                START →
              </button>
            </div>
          );
        })}
        <div style={{ height:16 }} />
      </div>
    </div>
  );
};

// ── ACTIVE SESSION ─────────────────────────────────────────────────────────
const ActiveSessionScreen = ({ workout, onFinish }) => {
  const [exIdx, setExIdx] = useState(0);
  const [setIdx, setSetIdx] = useState(0);
  const [completedSets, setCompletedSets] = useState({});
  const [resting, setResting] = useState(false);
  const [restTime, setRestTime] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [done, setDone] = useState(false);
  const [weightMap, setWeightMap] = useState({});
  const [actualReps, setActualReps] = useState({});

  const ex = workout.exercises[exIdx];
  const total = workout.exercises.length;
  const key = (e,s) => `${e}-${s}`;
  const isDone = (e,s) => !!completedSets[key(e,s)];
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  useEffect(() => { const t = setInterval(() => setElapsed(e=>e+1), 1000); return ()=>clearInterval(t); }, []);
  useEffect(() => {
    if (!resting || restTime <= 0) { if (resting && restTime<=0) setResting(false); return; }
    const t = setTimeout(() => setRestTime(r=>r-1), 1000);
    return ()=>clearTimeout(t);
  }, [resting, restTime]);

  const markDone = () => {
    const reps = actualReps[key(exIdx,setIdx)] ?? ex.reps;
    setCompletedSets(c => ({...c, [key(exIdx,setIdx)]:{reps}}));
    const nextSet = setIdx+1;
    if (nextSet < ex.sets) {
      setSetIdx(nextSet);
      setActualReps(r => ({...r, [key(exIdx,nextSet)]:reps}));
      setResting(true); setRestTime(ex.rest);
    } else {
      const nextEx = exIdx+1;
      if (nextEx < total) { setResting(true); setRestTime(60); setTimeout(()=>{setExIdx(nextEx);setSetIdx(0);},0); }
      else setDone(true);
    }
  };

  if (done) return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg)", justifyContent:"center", alignItems:"center", padding:32 }}>
      <Mono size={10} color="var(--text3)" spacing={2}>Session complete</Mono>
      <div style={{ fontFamily:"var(--mono)", fontSize:72, fontWeight:500, color:"var(--accent)", letterSpacing:-3, marginTop:12, lineHeight:1 }}>{fmt(elapsed)}</div>
      <Mono size={11} color="var(--text2)" spacing={1} style={{ marginTop:10 }}>{total} movements done</Mono>
      <PrimaryBtn onClick={onFinish} style={{ marginTop:48, maxWidth:200 }}>Close</PrimaryBtn>
    </div>
  );

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg)", position:"relative" }}>
      {/* Top bar */}
      <div style={{ padding:"8px 18px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:"1px solid var(--border)" }}>
        <Mono size={11} color="var(--text3)" spacing={0.5}>{exIdx+1}/{total}</Mono>
        <div style={{ fontFamily:"var(--mono)", fontSize:15, color:"var(--text2)", letterSpacing:-0.5 }}>{fmt(elapsed)}</div>
        <GhostBtn onClick={onFinish} style={{ padding:"5px 12px", fontSize:12 }}>End</GhostBtn>
      </div>
      {/* Progress */}
      <div style={{ height:2, background:"var(--surface2)" }}>
        <div style={{ height:"100%", width:`${(exIdx/total)*100}%`, background:"var(--accent)", transition:"width 0.4s" }} />
      </div>

      <div style={{ flex:1, overflowY:"auto", padding:"20px 18px 16px", display:"flex", flexDirection:"column" }}>
        {/* Movement name */}
        <div style={{ fontSize:38, fontWeight:800, color:"var(--text)", letterSpacing:-1.5, lineHeight:1.0, marginBottom:4 }}>{ex.name}</div>
        <Mono size={10} color="var(--text3)" spacing={0.8} style={{ marginBottom:26 }}>
          Set {setIdx+1} of {ex.sets} &nbsp;·&nbsp; Target {ex.reps > 0 ? `${ex.reps} reps` : "max hold"}
        </Mono>

        {/* Set tracker — squares not circles */}
        <div style={{ display:"flex", gap:7, marginBottom:28 }}>
          {Array.from({length:ex.sets},(_,i) => (
            <div key={i} style={{
              width:13, height:13, borderRadius:2,
              background: isDone(exIdx,i) ? "var(--accent)" : (i===setIdx ? "var(--accent-dim)" : "var(--surface2)"),
              border: i===setIdx ? "1.5px solid var(--accent)" : "1.5px solid var(--border2)",
              transition:"all 0.2s",
            }} />
          ))}
        </div>

        {/* Reps + weight */}
        <div style={{ display:"flex", gap:10, marginBottom:16 }}>
          <div style={{ flex:1, background:"var(--surface)", borderRadius:4, padding:"12px 14px", border:"1px solid var(--border)" }}>
            <Label style={{ marginBottom:10 }}>Reps</Label>
            <Stepper
              value={actualReps[key(exIdx,setIdx)] ?? ex.reps}
              onDec={() => setActualReps(r=>({...r,[key(exIdx,setIdx)]:Math.max(0,(r[key(exIdx,setIdx)]??ex.reps)-1)}))}
              onInc={() => setActualReps(r=>({...r,[key(exIdx,setIdx)]:(r[key(exIdx,setIdx)]??ex.reps)+1}))}
              accent={true}
            />
          </div>
          <div style={{ flex:1, background:"var(--surface)", borderRadius:4, padding:"12px 14px", border:"1px solid var(--border)" }}>
            <Label style={{ marginBottom:10 }}>Added kg</Label>
            <Stepper
              value={weightMap[exIdx]||0}
              onDec={() => setWeightMap(m=>({...m,[exIdx]:Math.max(0,(m[exIdx]||0)-2.5)}))}
              onInc={() => setWeightMap(m=>({...m,[exIdx]:(m[exIdx]||0)+2.5}))}
              fmt={v => v%1===0?v:v.toFixed(1)}
            />
          </div>
        </div>

        {/* Skip nav */}
        <div style={{ display:"flex", gap:8, marginBottom:14 }}>
          {exIdx>0 && <GhostBtn onClick={()=>{setExIdx(e=>e-1);setSetIdx(0);}} style={{flex:1,padding:"9px",fontSize:12}}>← Prev</GhostBtn>}
          {exIdx<total-1 && <GhostBtn onClick={()=>{setExIdx(e=>e+1);setSetIdx(0);}} style={{flex:1,padding:"9px",fontSize:12}}>Skip →</GhostBtn>}
        </div>

        {/* Up next */}
        {exIdx<total-1 && (
          <div style={{ marginTop:"auto", paddingTop:8 }}>
            <Label>Up next</Label>
            <div style={{ fontSize:13, color:"var(--text2)", fontWeight:600 }}>{workout.exercises[exIdx+1].name}</div>
          </div>
        )}
      </div>

      <div style={{ padding:"0 18px 18px" }}>
        <PrimaryBtn onClick={markDone}>Mark Set Done</PrimaryBtn>
      </div>

      {/* Recovery overlay */}
      {resting && (
        <div style={{ position:"absolute", inset:0, background:"var(--bg)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", zIndex:20 }}>
          <Label style={{ marginBottom:18, letterSpacing:3 }}>Recovery</Label>
          <div style={{ fontFamily:"var(--mono)", fontSize:84, fontWeight:500, color:"var(--accent)", letterSpacing:-4, lineHeight:1 }}>{fmt(restTime)}</div>
          {exIdx<total-1 && (
            <Mono size={10} color="var(--text3)" spacing={1.5} style={{ marginTop:18 }}>
              next — {workout.exercises[exIdx+1].name}
            </Mono>
          )}
          <GhostBtn onClick={()=>{setResting(false);setRestTime(0);}} style={{ marginTop:44, padding:"10px 36px" }}>Skip rest</GhostBtn>
        </div>
      )}
    </div>
  );
};

// ── SESSION BUILDER ────────────────────────────────────────────────────────
const SessionBuilderScreen = ({ workout, onBack, onSave, initialMuscles=[] }) => {
  const [name, setName] = useState(workout ? workout.name : '');
  const [movements, setMovements] = useState(workout ? workout.exercises : []);
  const [days, setDays] = useState(workout ? workout.days : []);
  const [mode, setMode] = useState('smart');
  const [addingEx, setAddingEx] = useState(false);
  const [muscles] = useState(initialMuscles);

  const removeMovement = i => setMovements(m=>m.filter((_,idx)=>idx!==i));
  const estDuration = movements.reduce((acc,ex) => acc + ex.sets*30 + Math.max(0,ex.sets-1)*ex.rest, 0);

  if (addingEx) return (
    <MovementPickerScreen
      onBack={()=>setAddingEx(false)}
      onAdd={ex=>{setMovements(m=>[...m,{...ex,sets:3,reps:10,rest:45}]);setAddingEx(false);}}
    />
  );

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg)" }}>
      <NavBar
        left={<BackBtn onClick={onBack}/>}
        center={workout ? "Edit Session" : "New Session"}
        right={
          <button onClick={()=>onSave({name:name||"My Session",exercises:movements,days})} style={{ padding:"6px 14px", borderRadius:4, background:"var(--accent)", border:"none", color:"var(--accent-dark)", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"DM Sans" }}>Save</button>
        }
      />
      <div style={{ flex:1, overflowY:"auto" }}>

        {/* Target tags */}
        {muscles.length>0 && (
          <div style={{ padding:"16px 18px 0" }}>
            <Label>Targets</Label>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
              {muscles.map(id=>{const m=MUSCLE_GROUPS.find(g=>g.id===id); return m?(<span key={id} style={{ fontSize:12, padding:"4px 10px", borderRadius:3, background:"var(--accent-dim)", color:"var(--accent)", fontWeight:600, fontFamily:"DM Sans", border:"1px solid rgba(232,162,58,0.2)" }}>{m.label}</span>):null;})}
            </div>
          </div>
        )}

        {/* Name */}
        <div style={{ padding:"16px 18px 0" }}>
          <Label>Session name</Label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Full Body" style={{ width:"100%", padding:"11px 13px", borderRadius:4, background:"var(--surface)", border:"1px solid var(--border2)", color:"var(--text)", fontSize:15, outline:"none" }} />
        </div>

        {/* Mode toggle */}
        <div style={{ padding:"16px 18px 0" }}>
          <Label>Set style</Label>
          <div style={{ display:"flex", gap:8 }}>
            {[["smart","Smart pick"],["custom","I choose"]].map(([id,lbl]) => (
              <button key={id} onClick={()=>setMode(id)} style={{ flex:1, padding:"10px", borderRadius:4, cursor:"pointer", fontSize:13, fontWeight:600, fontFamily:"DM Sans", transition:"all 0.12s", background:mode===id?"var(--accent)":"var(--surface2)", border:mode===id?"1px solid var(--accent)":"1px solid var(--border2)", color:mode===id?"var(--accent-dark)":"var(--text2)" }}>{lbl}</button>
            ))}
          </div>
        </div>

        {/* Smart pick info */}
        {mode==="smart" && (
          <div style={{ margin:"14px 18px 0", padding:"14px", borderRadius:4, background:"var(--surface)", border:"1px solid var(--border)" }}>
            <div style={{ fontSize:13, fontWeight:700, color:"var(--text)", marginBottom:4 }}>Auto-selected movements</div>
            <div style={{ fontSize:12, color:"var(--text2)", lineHeight:1.6 }}>
              Movements are picked daily from your targets{muscles.length>0?` (${muscles.map(id=>MUSCLE_GROUPS.find(g=>g.id===id)?.label).filter(Boolean).join(", ")})`:""}. Switch to "I choose" to build manually.
            </div>
          </div>
        )}

        {/* Movement list */}
        {mode==="custom" && (
          <div style={{ padding:"16px 18px 0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
              <Label style={{ margin:0 }}>Movements</Label>
              <button onClick={()=>setAddingEx(true)} style={{ display:"flex", alignItems:"center", gap:5, padding:"5px 12px", borderRadius:3, background:"var(--accent)", border:"none", color:"var(--accent-dark)", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"DM Sans" }}>
                <I n="plus" size={12} color="var(--accent-dark)" /> Add
              </button>
            </div>
            {movements.length===0 && (
              <div style={{ padding:"22px", textAlign:"center", color:"var(--text3)", fontSize:13, background:"var(--surface)", borderRadius:4, border:"1px dashed var(--border2)", fontFamily:"var(--mono)", letterSpacing:0.5 }}>No movements yet</div>
            )}
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {movements.map((ex,i) => (
                <div key={i} style={{ background:"var(--surface)", borderRadius:4, border:"1px solid var(--border)", overflow:"hidden" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 13px" }}>
                    <I n="drag" size={16} color="var(--border2)" />
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:14, fontWeight:700, color:"var(--text)" }}>{ex.name}</div>
                      <Mono size={9} color="var(--text3)" spacing={0.4}>{ex.sets} sets · {ex.reps>0?`${ex.reps} reps`:"hold"} · {ex.rest}s rest</Mono>
                    </div>
                    <button onClick={()=>removeMovement(i)} style={{ background:"none", border:"none", cursor:"pointer", padding:4 }}>
                      <I n="remove" size={15} color="var(--danger)" />
                    </button>
                  </div>
                  <div style={{ borderTop:"1px solid var(--border)", padding:"10px 13px", display:"flex", gap:10 }}>
                    {[["Sets",ex.sets,v=>setMovements(m=>m.map((e,idx)=>idx===i?{...e,sets:v}:e)),1,null],
                      ["Reps",ex.reps,v=>setMovements(m=>m.map((e,idx)=>idx===i?{...e,reps:v}:e)),1,null],
                      ["Rest",ex.rest,v=>setMovements(m=>m.map((e,idx)=>idx===i?{...e,rest:v}:e)),15,s=>`${s}s`]
                    ].map(([lbl,val,set,step,fmtFn])=>(
                      <div key={lbl} style={{ flex:1 }}>
                        <Mono size={9} color="var(--text3)" spacing={0.5} style={{ marginBottom:6, display:"block" }}>{lbl}</Mono>
                        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                          <button onClick={()=>set(Math.max(step,val-step))} style={{ width:24, height:24, borderRadius:3, background:"var(--surface2)", border:"1px solid var(--border2)", color:"var(--text)", fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>−</button>
                          <span style={{ flex:1, textAlign:"center", fontSize:14, fontWeight:700, color:"var(--text)", fontFamily:"var(--mono)" }}>{fmtFn?fmtFn(val):val}</span>
                          <button onClick={()=>set(val+step)} style={{ width:24, height:24, borderRadius:3, background:"var(--accent)", border:"none", color:"var(--accent-dark)", fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>+</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Training days */}
        <div style={{ padding:"16px 18px 0" }}>
          <Label>Training days</Label>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
            {DAYS.map(d=><Chip key={d} label={d} on={days.includes(d)} onClick={()=>setDays(ds=>ds.includes(d)?ds.filter(x=>x!==d):[...ds,d])} small={true}/>)}
          </div>
          {days.length===0 && <Mono size={10} color="var(--text3)" spacing={0.3} style={{ marginTop:8, display:"block" }}>No days scheduled</Mono>}
        </div>

        {/* Duration estimate */}
        {movements.length>0 && (
          <div style={{ padding:"14px 18px 0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", padding:"12px 0", borderTop:"1px solid var(--border)" }}>
              <span style={{ fontSize:13, color:"var(--text2)" }}>Est. duration</span>
              <span style={{ fontFamily:"var(--mono)", fontSize:13, fontWeight:500, color:"var(--accent)" }}>~{Math.round(estDuration/60)} min</span>
            </div>
          </div>
        )}
        <div style={{ height:28 }} />
      </div>
    </div>
  );
};

          <Label>Include in sessions</Label>
          <div style={{ display:"flex", gap:8 }}>
            {[["more","More often"],["less","Less often"],["never","Exclude"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>setFreq(id)} style={{ flex:1, padding:"9px 4px", borderRadius:4, cursor:"pointer", fontSize:12, fontWeight:600, fontFamily:"DM Sans", background:freq===id?"var(--accent)":"var(--surface2)", border:freq===id?"1px solid var(--accent)":"1px solid var(--border2)", color:freq===id?"var(--accent-dark)":"var(--text2)", transition:"all 0.12s" }}>{lbl}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

// ── STREAK SCREEN ──────────────────────────────────────────────────────────
const StreakScreen = ({ onBack }) => {
  const weeks = Array.from({length:20},(_,w) => Array.from({length:7},(_,d) => Math.random()>0.62));
  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg)" }}>
      <NavBar left={<BackBtn onClick={onBack}/>} center="Streak" right={<div style={{width:40}}/>} />
      <div style={{ flex:1, overflowY:"auto", padding:"18px" }}>
        <div style={{ display:"flex", gap:10, marginBottom:24 }}>
          {[["0","Current"],["9","Longest"],["59","Total"]].map(([v,l])=>(
            <div key={l} style={{ flex:1, background:"var(--surface)", borderRadius:4, padding:"14px 10px", border:"1px solid var(--border)", textAlign:"center" }}>
              <div style={{ fontFamily:"var(--mono)", fontSize:26, fontWeight:500, color:l==="Current"?"var(--text3)":"var(--accent)", marginBottom:4 }}>{v}</div>
              <Mono size={9} color="var(--text3)" spacing={0.5}>{l}</Mono>
            </div>
          ))}
        </div>
        <Label style={{ marginBottom:12 }}>Activity — last 20 weeks</Label>
        <div style={{ background:"var(--surface)", borderRadius:4, padding:"14px", border:"1px solid var(--border)" }}>
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            {Array.from({length:7},(_,d)=>(
              <div key={d} style={{ display:"flex", gap:3 }}>
                {weeks.map((week,w)=>(
                  <div key={w} style={{ flex:1, height:9, borderRadius:1, background:week[d]?"var(--accent)":"var(--surface2)", opacity:week[d]?1:1 }} />
                ))}
              </div>
            ))}
          </div>
        </div>
        <Mono size={9} color="var(--text3)" spacing={0.5} style={{ marginTop:14, display:"block", textAlign:"center" }}>Manage streak in Settings</Mono>
      </div>
    </div>
  );
};

// ── APP ────────────────────────────────────────────────────────────────────
const App = () => {
  const [tab, setTab] = useState('workouts');
  const [screen, setScreen] = useState(null);

  const push = (type, data={}) => setScreen({type, data});
  const pop = () => setScreen(null);

  const content = () => {
    if (screen) {
      switch(screen.type) {
        case 'active':   return <ActiveSessionScreen   workout={screen.data.workout} onFinish={pop} />;
        case 'muscle':   return <MusclePickerScreen    onBack={pop} onNext={muscles=>setScreen({type:'builder',data:{workout:null,muscles}})} />;
        case 'builder':  return <SessionBuilderScreen  workout={screen.data.workout} initialMuscles={screen.data.muscles||[]} onBack={pop} onSave={pop} />;
        case 'session':  return <SessionDetailScreen   entry={screen.data.entry} onBack={pop} />;
        case 'movement': return <MovementDetailScreen  movement={screen.data.movement} onBack={pop} />;
        case 'streak':   return <StreakScreen           onBack={pop} />;
        default: return null;
      }
    }
    switch(tab) {
      case 'workouts':  return <TrainScreen   onStart={w=>push('active',{workout:w})} onEdit={w=>push('builder',{workout:w,muscles:[]})} onAdd={()=>push('muscle',{})} />;
      case 'history':   return <LogScreen     onView={e=>push('session',{entry:e})} />;
      case 'exercises': return <LibraryScreen onView={m=>push('movement',{movement:m})} />;
      default: return null;
    }
  };

  return (
    <IOSDevice dark={true} width={390} height={844}>
      <div style={{ display:"flex", flexDirection:"column", height:"100%", background:"var(--bg)", paddingTop:59 }}>
        <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column", minHeight:0 }}>
          {content()}
        </div>
        {!screen && <BottomNav tab={tab} setTab={setTab} />}
      </div>
    </IOSDevice>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
